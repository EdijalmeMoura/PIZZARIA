<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">Mil Grau Pizzaria — Forno a Lenha</title>
  <desc id="desc">Logo da Mil Grau Pizzaria com pizza artesanal, letras brancas e douradas e detalhes em vermelho e laranja.</desc>
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD64A"/><stop offset=".48" stop-color="#FF9B00"/><stop offset="1" stop-color="#E74612"/>
    </linearGradient>
    <linearGradient id="cheese" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFF7A3"/><stop offset=".42" stop-color="#FFE24D"/><stop offset="1" stop-color="#FFB400"/>
    </linearGradient>
    <linearGradient id="pepperoni" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4E26"/><stop offset="1" stop-color="#C51612"/>
    </linearGradient>
    <linearGradient id="wordGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD21A"/><stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB000"/><stop offset=".55" stop-color="#FF5B12"/><stop offset="1" stop-color="#E81921"/>
    </linearGradient>
    <filter id="pizzaShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dy="9" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="typeShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>


  <!-- Swooping flame-red rings echo the circular badge in the supplied mark. -->
  <g fill="none" stroke-linecap="round">
    <path d="M214 425C126 454 82 521 96 596" stroke="url(#swoosh)" stroke-width="23"/>
    <path d="M790 374c88 43 137 111 140 190" stroke="#EF1D24" stroke-width="24"/>
    <path d="M157 700c148 119 526 137 696 6" stroke="url(#swoosh)" stroke-width="22"/>
    <path d="M210 731c109 73 261 99 394 82" stroke="#FF9C00" stroke-width="8"/>
    <path d="M780 712c61-24 106-57 136-100" stroke="#F3261D" stroke-width="8"/>
  </g>

  <!-- Hand-drawn, oven-hot pizza with bubbling cheese, pepperoni and basil. -->
  <g filter="url(#pizzaShadow)" stroke-linejoin="round">
    <path d="M245 310c13-83 66-161 133-212C435 55 495 30 551 39c88 14 177 83 234 166 45 65 76 129 61 163-15 35-50 42-92 22-93-44-182-49-275-5-86 40-164 40-220 14-29-13-43-49-14-89Z" fill="url(#crust)" stroke="#D93B0F" stroke-width="12"/>
