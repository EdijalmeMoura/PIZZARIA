    <g fill="#208B24" stroke="#11631D" stroke-width="5">
      <path d="M439 181c12-39 55-62 101-54-12 45-46 70-101 54Z"/>
      <path d="M439 181c26-21 56-35 91-46" fill="none" stroke="#84D445" stroke-width="5"/>
      <path d="M604 191c15-33 51-45 85-31-16 34-44 48-85 31Z"/>
      <path d="M604 191c25-14 47-23 74-28" fill="none" stroke="#84D445" stroke-width="4"/>
