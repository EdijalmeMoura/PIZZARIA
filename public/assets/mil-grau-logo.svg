    <g fill="#D78413" opacity=".85">
      <circle cx="457" cy="120" r="5"/><circle cx="618" cy="129" r="5"/><circle cx="727" cy="285" r="5"/>
      <circle cx="411" cy="323" r="5"/><circle cx="569" cy="224" r="4"/><circle cx="757" cy="204" r="4"/>
    </g>
